<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="film_schedule">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>film_schedule</title>
  <link rel="manifest" href="manifest.json">
  <style>
  /* Netlifyバッジを非表示 */
  [data-netlify-badge],
  a[href*="netlify.com"] img,
  .netlify-badge,
  #netlify-badge {
    display: none !important;
    visibility: hidden !important;
  }
</style>
</head>
<script>
  // Netlifyバッジを強制削除
  document.addEventListener('DOMContentLoaded', function() {
    const remove = () => {
      document.querySelectorAll(
        '[data-netlify-badge], a[href*="netlify.com"] img, ' +
        '.netlify-badge, #netlify-badge, ' +
        'a[href="https://www.netlify.com"]'
      ).forEach(el => el.remove());
    };
    remove();
    // 遅れて挿入される場合も対応
    setTimeout(remove, 500);
    setTimeout(remove, 1500);
  });
</script>
<script>
// FlutterWebでOSからのファイルドロップを受け取るJS
window.addEventListener('dragover', function(e) {
  e.preventDefault();
  e.stopPropagation();
});

window.addEventListener('drop', function(e) {
  e.preventDefault();
  e.stopPropagation();
  
  const files = e.dataTransfer.files;
  if (!files || files.length === 0) return;
  
  const file = files[0];
  const ext = file.name.split('.').pop().toLowerCase();
  const allowed = ['pdf', 'txt', 'md', 'fountain', 'fdx', 'stry'];
  
  if (!allowed.includes(ext)) {
    alert('PDF / TXT / MD / STRY ファイルのみ対応しています');
    return;
  }
  
  const reader = new FileReader();
  reader.onload = function(ev) {
    // FlutterのDartコードにデータを渡す（LocalStorageを経由）
    if (ext === 'pdf') {
      // PDFはbase64で保存
      const base64 = ev.target.result.split(',')[1];
      localStorage.setItem('dropped_file_type', 'pdf');
      localStorage.setItem('dropped_file_name', file.name);
      localStorage.setItem('dropped_file_data', base64);
    } else {
      // テキストはそのまま保存
      localStorage.setItem('dropped_file_type', 'text');
      localStorage.setItem('dropped_file_name', file.name);
      localStorage.setItem('dropped_file_data', ev.target.result);
    }
    localStorage.setItem('dropped_file_ready', 'true');
    // ページをリロードせずにFlutter側に通知
    window.dispatchEvent(new CustomEvent('fileDropped', {detail: {name: file.name, type: ext}}));
  };
  
  if (ext === 'pdf') {
    reader.readAsDataURL(file);
  } else {
    reader.readAsText(file, 'UTF-8');
  }
});
</script>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
